# Railway Configuration
# This file configures automatic PostgreSQL provisioning and deployment

[build]
builder = "nixpacks"

[deploy]
startCommand = "mkdir -p /prisma && npx prisma db push --skip-generate && npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Health check configuration
healthcheckPath = "/api/videos"
healthcheckTimeout = 100

# Volume configuration for SQLite database
[[volumes]]
mountPath = "/prisma"

