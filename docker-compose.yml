version: '3.8'

# Minimal docker-compose for local development
# Environment variables are passed from system environment (Railway style)
# Set them before running: export DATABASE_URL=... or use Railway CLI

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # These variables are passed from your shell environment
      # On Railway, these are automatically injected from service variables
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      ARGON2_SECRET: ${ARGON2_SECRET}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      B2_KEY_ID: ${B2_KEY_ID}
      B2_KEY_SECRET: ${B2_KEY_SECRET}
      B2_BUCKET: ${B2_BUCKET}
      B2_ENDPOINT: ${B2_ENDPOINT}
      B2_REGION: ${B2_REGION}
      CDN_BASE_URL: ${CDN_BASE_URL}
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/api/videos?limit=1', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
