services:
  - type: web
    name: video-platform
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && cd frontend && npm install && npm run build && cd .. && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/videos
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: STORAGE_MODE
        value: b2
      - key: B2_ENDPOINT
        value: https://s3.eu-central-003.backblazeb2.com
      - key: B2_REGION
        value: eu-central-003
      - key: B2_KEY_ID
        sync: false  # Set manually in Render dashboard
      - key: B2_KEY_SECRET
        sync: false  # Set manually in Render dashboard
      - key: B2_BUCKET
        value: video-platform-key
      - key: CDN_BASE_URL
        value: ""
      - key: JWT_SECRET
        generateValue: true
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ARGON2_SECRET
        generateValue: true
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: video-platform-db
          property: connectionString

databases:
  - name: video-platform-db
    plan: free
    databaseName: video_platform
    user: video_user

